[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sdlc-claudecode"
version = "1.0.0"
description = "Self-Evolving Autonomous Agent — learns from errors, never repeats mistakes"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

# Schema validation is a required runtime acceptance check.
dependencies = ["jsonschema>=4"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
ai-sdlc = "ai_sdlc_claudecode.cli:main"

[tool.setuptools]
packages = ["ai_sdlc_claudecode", "ai_sdlc_claudecode.bash"]
include-package-data = false

[tool.setuptools.package-dir]
ai_sdlc_claudecode = "src/ai_sdlc_claudecode"
"ai_sdlc_claudecode.bash" = "."

[tool.setuptools.package-data]
"ai_sdlc_claudecode.bash" = [
    "*.sh", "pipeline-dag.json",
    "lib/*.sh", "lib/*.py", "lib/hooks/*.sh",
    "schemas/*.json", "prompts/**/*.md", "prompts/**/*.json",
    "scripts/*.sh", "scripts/*.py", "scripts/*.cjs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["ai_sdlc_claudecode"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 50
